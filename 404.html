<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found | Bricks Scholarships</title>
<meta name="description" content="This page seems to be a forgotten brick. Head back to Bricks Scholarships.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
<link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{
    --princeton-orange:#ff8811;
    --jasmine:#f4d06f;
    --floral-white:#fff8f0;
    --pearl-aqua:#9dd9d2;
    --space-indigo:#392f5a;
    --ink:var(--space-indigo);
    --bg:var(--floral-white);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh;
    display:flex;flex-direction:column;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter','Helvetica Neue',Arial,sans-serif;
    line-height:1.6;
    overflow-x:hidden;
  }

  /* drifting glow orbs, same as the homepage */
  .glow-field{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .glow-orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;}
  .glow-orb.a{width:340px;height:340px;top:-8%;left:-6%;background:var(--jasmine);animation:drift1 14s ease-in-out infinite;}
  .glow-orb.b{width:300px;height:300px;bottom:-10%;right:-4%;background:var(--pearl-aqua);animation:drift2 18s ease-in-out infinite;}
  .glow-orb.c{width:220px;height:220px;top:55%;left:55%;background:var(--princeton-orange);opacity:.3;animation:drift3 11s ease-in-out infinite;}
  @keyframes drift1{0%,100%{transform:translate(0,0);}33%{transform:translate(60px,-40px);}66%{transform:translate(-30px,30px);}}
  @keyframes drift2{0%,100%{transform:translate(0,0);}33%{transform:translate(-50px,40px);}66%{transform:translate(40px,-25px);}}
  @keyframes drift3{0%,100%{transform:translate(0,0);}50%{transform:translate(35px,50px);}}

  header{position:relative;z-index:1;padding:1.5rem;display:flex;justify-content:center;}
  .brand{
    display:inline-flex;align-items:center;gap:.65rem;
    color:var(--ink);text-decoration:none;
    font-family:'Space Grotesk','Inter',sans-serif;font-weight:700;letter-spacing:.01em;
  }
  .brand img{width:38px;height:38px;object-fit:contain;border-radius:8px;}

  main{
    position:relative;z-index:1;flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:1rem 1.5rem 3rem;
  }

  /* the wall with one missing brick */
  .wall{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    width:min(340px,80vw);
    margin:3.5rem 0 2rem;
    position:relative;
  }
  .brick{
    position:relative;
    height:54px;
    border-radius:8px;
    background:var(--space-indigo);
    box-shadow:0 5px 0 rgba(0,0,0,.22);
  }
  .brick::before,.brick::after{ /* studs */
    content:'';position:absolute;top:-6px;width:16px;height:8px;border-radius:4px 4px 0 0;
    background:inherit;
  }
  .brick::before{left:22%;}
  .brick::after{right:22%;}
  .brick.o{background:var(--princeton-orange);}
  .brick.j{background:var(--jasmine);}
  .brick.a{background:var(--pearl-aqua);}
  .brick.span2{grid-column:span 2;}
  .brick.gap{
    background:transparent;box-shadow:none;
    border:3px dashed rgba(57,47,90,.35);
  }
  .brick.gap::before,.brick.gap::after{display:none;}
  .brick.gap span{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.6rem;color:rgba(57,47,90,.55);
  }
  /* the stray brick floating above the gap */
  .brick.stray{
    position:absolute;top:-46px;right:0;transform-origin:center;width:calc((100% - 16px) / 3);
    background:var(--princeton-orange);
    animation:float 3.2s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-12px) rotate(3deg);}}

  .code{
    font-family:'Space Grotesk',sans-serif;font-weight:800;
    font-size:clamp(4rem,14vw,7.5rem);line-height:1;letter-spacing:-.02em;
    color:var(--ink);
    text-shadow:7px 7px 0 var(--princeton-orange),6px 6px 0 var(--princeton-orange);
    margin-bottom:1rem;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(1.4rem,3.5vw,2rem);margin-bottom:.6rem;
  }
  p{max-width:34rem;opacity:.85;margin-bottom:1.75rem;}

  .actions{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center;}
  .btn{
    display:inline-block;padding:.8rem 1.5rem;border-radius:999px;
    font-weight:600;text-decoration:none;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn.primary{background:var(--princeton-orange);color:var(--space-indigo);box-shadow:0 4px 0 rgba(57,47,90,.35);}
  .btn.ghost{border:2px solid var(--space-indigo);color:var(--space-indigo);}
  .btn:hover,.btn:focus-visible{transform:translateY(-2px);}
  .btn:focus-visible{outline:3px solid var(--space-indigo);outline-offset:3px;}

  footer{
    position:relative;z-index:1;text-align:center;
    padding:1.25rem 1.5rem;font-size:.85rem;opacity:.7;
  }


  /* ---------- interactive bricks ---------- */
  .wall .brick:not(.gap){cursor:pointer;}
  .poke{
    display:block;margin:-.5rem auto 1.75rem;
    background:none;border:0;cursor:pointer;
    font:inherit;font-size:.9rem;font-weight:600;color:var(--space-indigo);
    text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px;
    opacity:.8;
  }
  .poke:hover,.poke:focus-visible{opacity:1;}
  .poke:focus-visible{outline:3px solid var(--space-indigo);outline-offset:4px;border-radius:4px;}
  #layer{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:5;}
  .piece{
    position:absolute;left:0;top:0;margin:0;
    pointer-events:auto;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
    animation:none !important;transform-origin:50% 50%;will-change:transform;
  }
  .piece.held{cursor:grabbing;filter:brightness(1.06);}

  @media (prefers-reduced-motion:reduce){
    .glow-orb,.brick.stray{animation:none !important;}
    .btn{transition:none;}
  }
</style>
</head>
<body>
  <div id="layer" aria-hidden="true"></div>
  <div class="glow-field" aria-hidden="true">
    <div class="glow-orb a"></div>
    <div class="glow-orb b"></div>
    <div class="glow-orb c"></div>
  </div>

  <header>
    <a class="brand" href="/">
      <img src="bricks-scholarships-site/cookconnorp-art.github.io-main/nav-logo.png" alt="">
      BricksScholarships.org
    </a>
  </header>

  <main>
    <div class="wall" aria-hidden="true">
      <div class="brick"></div>
      <div class="brick a"></div>
      <div class="brick gap"><span>?</span></div>
      <div class="brick j"></div>
      <div class="brick o span2"></div>
      <div class="brick a span2"></div>
      <div class="brick"></div>
      <div class="brick stray"></div>
    </div>

    <button class="poke" id="knock" type="button">Go on, click one of the bricks!</button>

    <div class="code">404</div>
    <h1>This brick went missing.</h1>
    <p>The page you were looking for doesn&rsquo;t exist or has moved.</p>

    <div class="actions">
      <a class="btn primary" href="/">Back to the homepage</a>
      <a class="btn ghost" href="/#contact">Get in touch</a>
    </div>
  </main>

  <footer>&copy; 2026 Bricks Scholarships. Building the next chapter, one forgotten brick at a time.</footer>

<script>
(function(){
  var wall=document.querySelector('.wall'),layer=document.getElementById('layer'),btn=document.getElementById('knock');
  if(!wall||!layer||!btn)return;

  var G=1800, STEP=1/120, ITER=10, MU=0.5, SLOP=0.5;
  var pieces=[], statics=[], fallen=false, raf=0, lastT=0, acc=0, grab=null;
  var W=innerWidth, H=innerHeight;

  function body(x,y,w,h,fixed){
    var b={x:x,y:y,a:0,vx:0,vy:0,w:0,hw:w/2,hh:h/2,im:0,ii:0,el:null,c:1,s:0};
    if(!fixed){var m=w*h/1000;b.im=1/m;b.ii=12/(m*(w*w+h*h));}
    return b;
  }
  function buildStatics(){
    W=innerWidth;H=innerHeight;
    var t=2000;
    statics=[
      body(W/2,H+t/2,W+4*t,t,true),
      body(-t/2,H/2,t,H*6,true),
      body(W+t/2,H/2,t,H*6,true)
    ];
    // the big 404 and the buttons are solid shelves
    document.querySelectorAll('.code,.actions .btn').forEach(function(el){
      var r=el.getBoundingClientRect();
      var inset=el.classList.contains('code')?[10,18]:[0,0];
      statics.push(body(r.left+r.width/2,r.top+r.height/2,r.width-inset[0]*2,r.height-inset[1]*2,true));
    });
  }
  function corners(b){
    var c=Math.cos(b.a),s=Math.sin(b.a),out=[];
    [[1,1],[1,-1],[-1,-1],[-1,1]].forEach(function(k){
      var lx=k[0]*b.hw,ly=k[1]*b.hh;
      out.push([b.x+lx*c-ly*s,b.y+lx*s+ly*c]);
    });
    return out;
  }
  function inside(b,p,eps){
    var c=Math.cos(b.a),s=Math.sin(b.a),dx=p[0]-b.x,dy=p[1]-b.y;
    var lx=dx*c+dy*s,ly=-dx*s+dy*c;
    return Math.abs(lx)<=b.hw+eps&&Math.abs(ly)<=b.hh+eps;
  }
  function collide(A,B){
    var c1=Math.cos(A.a),s1=Math.sin(A.a),c2=Math.cos(B.a),s2=Math.sin(B.a);
    var ua=[[c1,s1],[-s1,c1]],ub=[[c2,s2],[-s2,c2]];
    var dx=B.x-A.x,dy=B.y-A.y,best=1e9,n=null,axes=[ua[0],ua[1],ub[0],ub[1]];
    for(var i=0;i<4;i++){
      var ax=axes[i];
      var ra=A.hw*Math.abs(ax[0]*ua[0][0]+ax[1]*ua[0][1])+A.hh*Math.abs(ax[0]*ua[1][0]+ax[1]*ua[1][1]);
      var rb=B.hw*Math.abs(ax[0]*ub[0][0]+ax[1]*ub[0][1])+B.hh*Math.abs(ax[0]*ub[1][0]+ax[1]*ub[1][1]);
      var d=dx*ax[0]+dy*ax[1],ov=ra+rb-Math.abs(d);
      if(ov<=0)return null;
      if(ov<best-0.01){best=ov;n=d<0?[-ax[0],-ax[1]]:[ax[0],ax[1]];}
    }
    var pts=[];
    corners(A).forEach(function(p){if(inside(B,p,0.5))pts.push(p);});
    corners(B).forEach(function(p){if(inside(A,p,0.5))pts.push(p);});
    if(!pts.length)pts.push([(A.x+B.x)/2,(A.y+B.y)/2]);
    return {A:A,B:B,n:n,d:best,pts:pts.map(function(p){return {p:p,jn:0,jt:0,rax:p[0]-A.x,ray:p[1]-A.y,rbx:p[0]-B.x,rby:p[1]-B.y};})};
  }
  function relVel(A,B,k){
    return [B.vx-B.w*k.rby-(A.vx-A.w*k.ray), B.vy+B.w*k.rbx-(A.vy+A.w*k.rax)];
  }
  function push(A,B,k,px,py){
    A.vx-=px*A.im;A.vy-=py*A.im;A.w-=(k.rax*py-k.ray*px)*A.ii;
    B.vx+=px*B.im;B.vy+=py*B.im;B.w+=(k.rbx*py-k.rby*px)*B.ii;
  }
  function step(dt){
    var i,j;
    // gravity + mouse spring
    for(i=0;i<pieces.length;i++){var b=pieces[i];b.vy+=G*dt;}
    if(grab){
      var g=grab,b=g.b,c=Math.cos(b.a),s=Math.sin(b.a);
      var rx=g.lx*c-g.ly*s,ry=g.lx*s+g.ly*c;
      var ex=g.tx-(b.x+rx),ey=g.ty-(b.y+ry);
      var vax=b.vx-b.w*ry,vay=b.vy+b.w*rx;
      var K=260,D=22;
      var fx=K*ex-D*vax,fy=K*ey-D*vay;       // per unit mass
      var m=1/b.im;
      b.vx+=fx*dt;b.vy+=fy*dt;
      b.w+=(rx*fy-ry*fx)*m*b.ii*dt;
      var sp=Math.hypot(b.vx,b.vy);if(sp>2600){b.vx*=2600/sp;b.vy*=2600/sp;}
    }
    // contacts
    var cons=[],all=pieces.concat(statics);
    for(i=0;i<pieces.length;i++){
      for(j=i+1;j<all.length;j++){
        var A=pieces[i],B=all[j];
        if(Math.abs(A.x-B.x)>A.hw+A.hh+B.hw+B.hh&&B.im)continue;
        var k=collide(A,B);if(k)cons.push(k);
      }
    }
    cons.forEach(function(k){
      var n=k.n;
      k.pts.forEach(function(p){
        var rv=relVel(k.A,k.B,p);
        var vn=rv[0]*n[0]+rv[1]*n[1];
        p.bias=Math.max(0.2/dt*Math.max(k.d-SLOP,0), vn<-60?-0.15*vn:0);
        var rnA=p.rax*n[1]-p.ray*n[0],rnB=p.rbx*n[1]-p.rby*n[0];
        p.kn=k.A.im+k.B.im+rnA*rnA*k.A.ii+rnB*rnB*k.B.ii;
        var t=[-n[1],n[0]];
        var rtA=p.rax*t[1]-p.ray*t[0],rtB=p.rbx*t[1]-p.rby*t[0];
        p.kt=k.A.im+k.B.im+rtA*rtA*k.A.ii+rtB*rtB*k.B.ii;
      });
    });
    for(var it=0;it<ITER;it++){
      for(i=0;i<cons.length;i++){
        var k=cons[i],n=k.n,t=[-n[1],n[0]];
        for(j=0;j<k.pts.length;j++){
          var p=k.pts[j];
          // normal
          var rv=relVel(k.A,k.B,p);
          var vn=rv[0]*n[0]+rv[1]*n[1];
          var l=(p.bias-vn)/p.kn,old=p.jn;
          p.jn=Math.max(old+l,0);l=p.jn-old;
          push(k.A,k.B,p,n[0]*l,n[1]*l);
          // friction
          rv=relVel(k.A,k.B,p);
          var vt=rv[0]*t[0]+rv[1]*t[1];
          var lt=-vt/p.kt,oldt=p.jt,mx=MU*p.jn;
          p.jt=Math.max(-mx,Math.min(mx,oldt+lt));lt=p.jt-oldt;
          push(k.A,k.B,p,t[0]*lt,t[1]*lt);
        }
      }
    }
    // integrate + settle
    for(i=0;i<pieces.length;i++){
      var b=pieces[i];
      b.x+=b.vx*dt;b.y+=b.vy*dt;b.a+=b.w*dt;
      b.vx*=0.9995;b.vy*=0.9995;b.w*=0.998;
      if(b!==(grab&&grab.b)&&Math.hypot(b.vx,b.vy)<12&&Math.abs(b.w)<0.15){b.vx*=0.92;b.w*=0.85;}
      // safety: never lose a brick
      if(b.x<-200||b.x>W+200||b.y>H+200){b.x=Math.min(Math.max(b.x,60),W-60);b.y=Math.min(b.y,H-60);b.vx=b.vy=b.w=0;}
    }
  }
  function render(){
    for(var i=0;i<pieces.length;i++){
      var b=pieces[i];
      b.el.style.transform='translate('+(b.x-b.hw).toFixed(2)+'px,'+(b.y-b.hh).toFixed(2)+'px) rotate('+b.a.toFixed(4)+'rad)';
    }
  }
  function frame(t){
    raf=requestAnimationFrame(frame);
    if(document.hidden){lastT=t;return;}
    acc+=Math.min((t-lastT)/1000,0.05);lastT=t;
    var n=0;
    while(acc>=STEP&&n<6){step(STEP);acc-=STEP;n++;}
    if(n===6)acc=0;
    render();
  }
  function start(){cancelAnimationFrame(raf);lastT=performance.now();acc=0;raf=requestAnimationFrame(frame);}

  function knock(){
    if(fallen)return;
    fallen=true;buildStatics();
    var bricks=wall.querySelectorAll('.brick:not(.gap)');
    for(var i=0;i<bricks.length;i++){
      var o=bricks[i],r=o.getBoundingClientRect();
      var w=o.offsetWidth,h=o.offsetHeight;
      var b=body(r.left+r.width/2,r.top+r.height/2,w,h,false);
      var el=document.createElement('div');
      el.className=o.className+' piece';
      el.style.width=w+'px';el.style.height=h+'px';
      b.el=el;layer.appendChild(el);
      o.style.visibility='hidden';
      b.vx=(Math.random()-.5)*260;b.vy=-Math.random()*160;b.w=(Math.random()-.5)*2.4;
      el.addEventListener('pointerdown',onDown);
      el._b=b;pieces.push(b);
    }
    btn.textContent='Click to rebuild it';
    start();render();
  }
  function rebuild(){
    fallen=false;grab=null;cancelAnimationFrame(raf);
    pieces=[];layer.innerHTML='';
    wall.querySelectorAll('.brick').forEach(function(o){o.style.visibility='';});
    btn.textContent='Go on, click the bricks!';
  }
  function onDown(e){
    var b=e.currentTarget._b;if(!b)return;
    e.preventDefault();
    try{e.currentTarget.setPointerCapture(e.pointerId);}catch(_){}
    var dx=e.clientX-b.x,dy=e.clientY-b.y,c=Math.cos(b.a),s=Math.sin(b.a);
    grab={b:b,id:e.pointerId,lx:dx*c+dy*s,ly:-dx*s+dy*c,tx:e.clientX,ty:e.clientY};
    b.el.classList.add('held');
    // bring to front
    layer.appendChild(b.el);
  }
  function onMove(e){if(grab&&e.pointerId===grab.id){grab.tx=e.clientX;grab.ty=e.clientY;}}
  function onUp(e){
    if(grab&&e.pointerId===grab.id){grab.b.el.classList.remove('held');grab=null;}
  }
  addEventListener('pointermove',onMove);
  addEventListener('pointerup',onUp);
  addEventListener('pointercancel',onUp);
  addEventListener('resize',function(){if(fallen)buildStatics();});
  addEventListener('scroll',function(){if(fallen)buildStatics();},{passive:true});

  btn.addEventListener('click',function(){fallen?rebuild():knock();});
  wall.addEventListener('pointerdown',function(e){
    var o=e.target.closest&&e.target.closest('.brick');
    if(!o||o.classList.contains('gap')||fallen)return;
    knock();
    var p=null;
    for(var i=0;i<pieces.length;i++){if(pieces[i].el.className.indexOf('stray')<0||true){
      var b=pieces[i],r=b.el.getBoundingClientRect();
      if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){p=b;}
    }}
    if(p){
      var dx=e.clientX-p.x,dy=e.clientY-p.y;
      grab={b:p,id:e.pointerId,lx:dx,ly:dy,tx:e.clientX,ty:e.clientY};
      p.el.classList.add('held');
      try{p.el.setPointerCapture(e.pointerId);}catch(_){}
    }
  });
  window.__bricks={pieces:function(){return pieces;}};
})();
</script>
</body>
</html>
